
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#29432d">

<title>Crear cuenta | Coros Del Campo</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --verde: #29432d;
    --verde-claro: #466444;
    --crema: #f5efdf;
    --madera: #806044;
    --texto: #302d24;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 25px 15px;
    font-family: Arial, sans-serif;
    background:
        linear-gradient(#182b2090, #182b2090),
        linear-gradient(135deg, #66834d, #9b9661, #604b31);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--texto);
}

.register-container {
    width: 100%;
    max-width: 460px;
    background: var(--crema);
    padding: 32px;
    border-radius: 16px;
    border-bottom: 6px solid var(--madera);
    box-shadow: 0 15px 40px #0004;
    text-align: center;
}

.logo img {
    width: 100px;
    height: 100px;
    object-fit: contain;
}

h1 {
    color: var(--verde);
    font-family: Georgia, serif;
    font-size: 29px;
    margin: 10px 0 5px;
}

.subtitle {
    color: #77715f;
    font-size: 14px;
    margin-bottom: 25px;
}

.form-group {
    text-align: left;
    margin-bottom: 16px;
}

label {
    display: block;
    color: var(--verde);
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #d9cfb6;
    border-radius: 8px;
    background: #fffdf6;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: var(--verde-claro);
    box-shadow: 0 0 0 3px #46644420;
}

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 75px;
}

.toggle {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: none;
    color: var(--verde);
    cursor: pointer;
    font-size: 12px;
    font-weight: bold;
}

.terms {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    text-align: left;
    font-size: 13px;
    color: #686250;
    line-height: 1.5;
    margin: 20px 0;
}

.terms input {
    width: auto;
    margin-top: 3px;
}

.terms a {
    color: var(--verde);
}

.register-button {
    width: 100%;
    padding: 15px;
    background: var(--verde);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background .2s;
}

.register-button:hover {
    background: var(--verde-claro);
}

.message {
    display: none;
    padding: 12px;
    margin-top: 15px;
    background: #e9e1ce;
    border-radius: 8px;
    color: var(--verde);
    font-size: 13px;
    line-height: 1.5;
}

.links {
    margin-top: 22px;
    font-size: 14px;
    line-height: 2;
}

.links a {
    color: var(--verde);
    font-weight: bold;
    text-decoration: none;
}

.back {
    display: inline-block;
    margin-top: 18px;
    color: #77715f;
    font-size: 13px;
    text-decoration: none;
}

footer {
    margin-top: 20px;
    color: #77715f;
    font-size: 12px;
}

@media(max-width: 450px) {
    .register-container {
        padding: 25px 20px;
    }
}
</style>
</head>

<body>

<div class="register-container">

    <div class="logo">
        <img src="logo.jpg" alt="Logo de Coros Del Campo">
    </div>

    <h1>Crear una cuenta</h1>

    <p class="subtitle">
        Únete a nuestra comunidad musical
    </p>

    <form id="registerForm">

        <div class="form-group">
            <label for="name">Nombre completo</label>
            <input
                type="text"
                id="name"
                placeholder="Tu nombre"
                autocomplete="name"
                required
            >
        </div>

        <div class="form-group">
            <label for="username">Nombre de usuario</label>
            <input
                type="text"
                id="username"
                placeholder="Ejemplo: usuario123"
                autocomplete="username"
                minlength="3"
                required
            >
        </div>

        <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input
                type="email"
                id="email"
                placeholder="ejemplo@correo.com"
                autocomplete="email"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>

            <div class="password-box">
                <input
                    type="password"
                    id="password"
                    placeholder="Mínimo 8 caracteres"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <button type="button" class="toggle"
                    data-target="password">
                    Mostrar
                </button>
            </div>
        </div>

        <div class="form-group">
            <label for="confirmPassword">
                Confirmar contraseña
            </label>

            <div class="password-box">
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Repite tu contraseña"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <button type="button" class="toggle"
                    data-target="confirmPassword">
                    Mostrar
                </button>
            </div>
        </div>

        <label class="terms">
            <input type="checkbox" id="acceptTerms" required>
            <span>
                Acepto las condiciones de uso de Coros Del Campo.
            </span>
        </label>

        <button type="submit" class="register-button">
            Crear cuenta
        </button>

        <div class="message" id="message"></div>

    </form>

    <div class="links">
        ¿Ya tienes una cuenta?<br>
        <a href="login.html">Iniciar sesión</a>
    </div>

    <a href="index.html" class="back">
        ← Volver al inicio
    </a>

    <footer>
        © 2026 Coros Del Campo
    </footer>

</div>

<script>
const form = document.getElementById("registerForm");
const message = document.getElementById("message");

document.querySelectorAll(".toggle").forEach(button => {
    button.addEventListener("click", () => {
        const input = document.getElementById(
            button.dataset.target
        );

        if (input.type === "password") {
            input.type = "text";
            button.textContent = "Ocultar";
        } else {
            input.type = "password";
            button.textContent = "Mostrar";
        }
    });
});

form.addEventListener("submit", event => {
    event.preventDefault();

    const password = document.getElementById("password").value;
    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        message.textContent = "Las contraseñas no coinciden.";
        message.style.display = "block";
        return;
    }

    message.textContent =
        "El formulario está preparado, pero el sistema de registro todavía no está conectado. Próximamente podrás crear tu cuenta.";

    message.style.display = "block";
});
</script>

</body>
</html>
