
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#29432d">

<title>Iniciar sesión | Coros Del Campo</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --verde: #29432d;
    --verde-claro: #466444;
    --crema: #f5efdf;
    --madera: #806044;
    --texto: #302d24;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background:
        linear-gradient(#182b2090, #182b2090),
        linear-gradient(135deg, #66834d, #9b9661, #604b31);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: var(--texto);
}

/* CONTENEDOR */

.login-container {
    width: 100%;
    max-width: 420px;
    background: var(--crema);
    padding: 35px 30px;
    border-radius: 16px;
    border-bottom: 6px solid var(--madera);
    box-shadow: 0 15px 40px #0004;
    text-align: center;
}

/* LOGO */

.logo img {
    width: 110px;
    height: 110px;
    object-fit: contain;
    border-radius: 10px;
}

h1 {
    color: var(--verde);
    font-family: Georgia, serif;
    font-size: 29px;
    margin: 12px 0 5px;
}

.subtitle {
    color: #77715f;
    font-size: 14px;
    margin-bottom: 28px;
}

/* FORMULARIO */

.form-group {
    text-align: left;
    margin-bottom: 18px;
}

label {
    display: block;
    color: var(--verde);
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 8px;
}

.input-container {
    position: relative;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #d9cfb6;
    border-radius: 8px;
    background: #fffdf6;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: var(--verde-claro);
    box-shadow: 0 0 0 3px #46644420;
}

.show-password {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: none;
    cursor: pointer;
    color: var(--verde);
    font-size: 13px;
}

/* BOTÓN */

.login-button {
    width: 100%;
    padding: 15px;
    margin-top: 8px;
    background: var(--verde);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background .2s;
}

.login-button:hover {
    background: var(--verde-claro);
}

/* ENLACES */

.links {
    margin-top: 23px;
    font-size: 14px;
    line-height: 2;
}

.links a {
    color: var(--verde);
    font-weight: bold;
    text-decoration: none;
}

.links a:hover {
    text-decoration: underline;
}

.back {
    display: inline-block;
    margin-top: 20px;
    color: #77715f;
    font-size: 13px;
    text-decoration: none;
}

.back:hover {
    color: var(--verde);
}

/* MENSAJE */

.message {
    display: none;
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    background: #e9e1ce;
    color: var(--verde);
    font-size: 13px;
    line-height: 1.5;
}

footer {
    margin-top: 22px;
    color: #77715f;
    font-size: 12px;
}

@media(max-width: 450px) {
    .login-container {
        padding: 28px 20px;
    }
}
</style>
</head>

<body>

<div class="login-container">

    <!-- LOGO -->
    <div class="logo">
        <img src="logo.jpg" alt="Coros Del Campo">
    </div>

    <h1>Bienvenido</h1>

    <p class="subtitle">
        Inicia sesión en Coros Del Campo
    </p>

    <!-- FORMULARIO -->
    <form id="loginForm">

        <div class="form-group">
            <label for="email">Correo electrónico</label>

            <input
                type="email"
                id="email"
                placeholder="ejemplo@correo.com"
                autocomplete="email"
                required
            >
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>

            <div class="input-container">
                <input
                    type="password"
                    id="password"
                    placeholder="Escribe tu contraseña"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="show-password"
                    id="togglePassword"
                >
                    Mostrar
                </button>
            </div>
        </div>

        <button type="submit" class="login-button">
            Iniciar sesión
        </button>

        <div class="message" id="message">
            El sistema de cuentas todavía no está conectado.
            Próximamente podrás iniciar sesión.
        </div>

    </form>

    <!-- ENLACES -->
    <div class="links">
        ¿No tienes una cuenta?<br>
        <a href="registro.html">Crear una cuenta</a>
    </div>

    <a href="index.html" class="back">
        ← Volver al inicio
    </a>

    <footer>
        © 2026 Coros Del Campo
    </footer>

</div>

<script>
const password = document.getElementById("password");
const toggle = document.getElementById("togglePassword");
const form = document.getElementById("loginForm");
const message = document.getElementById("message");

toggle.addEventListener("click", () => {
    if (password.type === "password") {
        password.type = "text";
        toggle.textContent = "Ocultar";
    } else {
        password.type = "password";
        toggle.textContent = "Mostrar";
    }
});

form.addEventListener("submit", (event) => {
    event.preventDefault();
    message.style.display = "block";
});
</script>

</body>
</html>
